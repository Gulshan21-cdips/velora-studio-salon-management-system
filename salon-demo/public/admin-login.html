<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Login | Velora Studio</title>

    <style>

        /* =========================
           VARIABLES
        ========================= */

        :root {
            --bg: #f7f3ee;
            --surface: #ffffff;
            --dark: #1d1a17;
            --dark-soft: #332e29;
            --text: #514a43;
            --muted: #8b8177;
            --gold: #b58b52;
            --gold-dark: #8f6a3b;
            --border: #e6ded4;
            --shadow: 0 25px 70px rgba(45, 35, 25, 0.14);
            --serif: "Playfair Display", Georgia, serif;
            --sans: "DM Sans", Arial, sans-serif;
        }


        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family: var(--sans);

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(181, 139, 82, 0.14),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(181, 139, 82, 0.10),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);
        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-wrapper {
            width: 100%;
            max-width: 430px;
        }


        .login-card {
            position: relative;

            background: rgba(255, 255, 255, 0.94);

            border: 1px solid rgba(181, 139, 82, 0.18);

            border-radius: 24px;

            padding: 45px 40px;

            box-shadow: var(--shadow);

            animation: cardAppear 0.7s ease;
        }


        @keyframes cardAppear {

            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================
           BRAND
        ========================= */

        .brand {
            text-align: center;
            margin-bottom: 35px;
        }


        .brand-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--dark);

            color: var(--gold);

            font-family: var(--serif);
            font-size: 24px;

            border: 1px solid rgba(181, 139, 82, 0.5);

            box-shadow:
                0 10px 30px rgba(29, 26, 23, 0.16);
        }


        .brand h1 {
            font-family: var(--serif);

            font-size: 32px;

            color: var(--dark);

            margin-bottom: 6px;
        }


        .brand p {
            font-size: 12px;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: var(--gold-dark);
        }


        /* =========================
           OWNER BADGE
        ========================= */

        .owner-badge {
            width: fit-content;

            margin: 0 auto 28px;

            padding: 7px 14px;

            border-radius: 30px;

            background: rgba(181, 139, 82, 0.10);

            color: var(--gold-dark);

            font-size: 11px;

            font-weight: 600;

            letter-spacing: 1px;

            text-transform: uppercase;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;

            color: var(--dark-soft);
        }


        .input-wrapper {
            position: relative;
        }


        .input-wrapper span {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 17px;

            opacity: 0.65;
        }


        .input-wrapper input {
            width: 100%;

            height: 50px;

            padding: 0 15px 0 45px;

            border: 1px solid var(--border);

            border-radius: 12px;

            outline: none;

            background: #fff;

            color: var(--dark);

            font-family: var(--sans);

            font-size: 14px;

            transition: 0.25s ease;
        }


        .input-wrapper input:focus {
            border-color: var(--gold);

            box-shadow:
                0 0 0 4px rgba(181, 139, 82, 0.10);
        }


        .input-wrapper input::placeholder {
            color: #aaa19a;
        }


        /* =========================
           PASSWORD TOGGLE
        ========================= */

        .password-toggle {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 16px;

            opacity: 0.6;
        }


        .password-toggle:hover {
            opacity: 1;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {
            width: 100%;

            height: 52px;

            margin-top: 8px;

            border: none;

            border-radius: 12px;

            background: var(--dark);

            color: white;

            font-family: var(--sans);

            font-size: 14px;

            font-weight: 600;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition: 0.3s ease;
        }


        .login-btn:hover {
            background: var(--gold-dark);

            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(143, 106, 59, 0.20);
        }


        .login-btn:active {
            transform: translateY(0);
        }


        .login-btn.loading {
            pointer-events: none;

            opacity: 0.7;
        }


        /* =========================
           ERROR
        ========================= */

        .error-message {
            display: none;

            margin-top: 15px;

            padding: 11px 13px;

            border-radius: 10px;

            background: #fff1f1;

            border: 1px solid #f1cccc;

            color: #a94442;

            font-size: 12px;

            text-align: center;
        }


        .error-message.show {
            display: block;

            animation: shake 0.3s ease;
        }


        @keyframes shake {

            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }


        /* =========================
           BACK LINK
        ========================= */

        .back-link {
            display: block;

            margin-top: 25px;

            text-align: center;

            color: var(--muted);

            text-decoration: none;

            font-size: 12px;

            transition: 0.2s ease;
        }


        .back-link:hover {
            color: var(--gold-dark);
        }


        /* =========================
           SECURITY TEXT
        ========================= */

        .security-text {
            margin-top: 22px;

            text-align: center;

            font-size: 10px;

            color: #aaa19a;

            letter-spacing: 0.3px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }


            .login-card {
                padding: 35px 25px;

                border-radius: 20px;
            }


            .brand h1 {
                font-size: 28px;
            }

        }


        @media (max-width: 360px) {

            .login-card {
                padding: 30px 20px;
            }

            .brand h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <main class="login-wrapper">

        <div class="login-card">


            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    V
                </div>

                <h1>Velora Studio</h1>

                <p>Owner Dashboard</p>

            </div>


            <!-- BADGE -->

            <div class="owner-badge">
                🔐 Secure Owner Login
            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <span>✉</span>

                        <input
                            type="email"
                            id="email"
                            placeholder="admin@velora.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span>🔒</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >
                    Login to Dashboard
                </button>


                <!-- ERROR -->

                <div
                    class="error-message"
                    id="errorMessage"
                ></div>


            </form>


            <!-- BACK -->

            <a
                href="index.html"
                class="back-link"
            >
                ← Back to Website
            </a>


            <div class="security-text">
                Your connection is protected by secure authentication
            </div>


        </div>

    </main>


    <script>

        /* =========================
           API
        ========================= */

        const API = "http://localhost:3000/api";


        /* =========================
           ELEMENTS
        ========================= */

        const loginForm =
            document.getElementById("loginForm");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginBtn =
            document.getElementById("loginBtn");

        const errorMessage =
            document.getElementById("errorMessage");

        const togglePassword =
            document.getElementById("togglePassword");


        /* =========================
           PASSWORD SHOW / HIDE
        ========================= */

        togglePassword.addEventListener(
            "click",
            () => {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    togglePassword.textContent = "🙈";

                } else {

                    passwordInput.type = "password";

                    togglePassword.textContent = "👁";

                }

            }
        );


        /* =========================
           LOGIN
        ========================= */

        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    emailInput.value.trim();

                const password =
                    passwordInput.value;


                errorMessage.classList.remove("show");

                loginBtn.classList.add("loading");

                loginBtn.textContent = "Logging in...";


                try {

                    const response = await fetch(
                        `${API}/admin/login`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email,
                                password
                            })
                        }
                    );


                    const data = await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Login failed"
                        );

                    }


                    /* =========================
                       SAVE JWT
                    ========================= */

                    localStorage.setItem(
                        "velora_admin_token",
                        data.token
                    );


                    /* =========================
                       SAVE ADMIN INFO
                    ========================= */

                    localStorage.setItem(
                        "velora_admin",
                        JSON.stringify(data.admin)
                    );


                    loginBtn.textContent =
                        "Login Successful ✓";


                    /* =========================
                       GO DASHBOARD
                    ========================= */

                    setTimeout(() => {

                        window.location.href =
                            "admin.html";

                    }, 500);


                } catch (error) {

                    console.error(error);


                    errorMessage.textContent =
                        error.message ||
                        "Something went wrong";


                    errorMessage.classList.add("show");


                    loginBtn.classList.remove("loading");

                    loginBtn.textContent =
                        "Login to Dashboard";

                }

            }
        );


        /* =========================
           IF ALREADY LOGGED IN
        ========================= */

        const existingToken =
            localStorage.getItem(
                "velora_admin_token"
            );


        if (existingToken) {

            window.location.href =
                "admin.html";

        }

    </script>

</body>

</html>
